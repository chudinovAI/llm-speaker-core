[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-speaker-core"
version = "0.1.0"
description = "Voice-first local assistant with hybrid RAG for GUAP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "faiss-cpu>=1.12.0",
    "huggingface-hub>=0.34.4",
    "httpx>=0.28.1",
    "pillow>=11.3.0",
    "pymupdf>=1.26.4",
    "pytesseract>=0.3.13",
    "pypdf>=6.4.2",
    "python-docx>=1.2.0",
    "requests>=2.32.5",
    "numpy>=2.4.3",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "torch>=2.8.0",
    "resemblyzer>=0.1.4",
    "webrtcvad-wheels>=2.0.14",
    "gigaam",
    "setuptools<81",
    "flagembedding>=1.3.5",
    "transformers<5",
    "sentence-transformers>=5",
    "einops>=0.8",
    "html2text>=2025.4.15",
]

[project.scripts]
llm-crawl-cloudflare = "llm_speaker_core.ingest.connectors.cloudflare:main"
llm-crawl = "llm_speaker_core.ingest.connectors.crawler:main"
llm-build-hybrid-index = "llm_speaker_core.retrieval.build:main"
llm-eval-hybrid-rag = "llm_speaker_core.retrieval.eval:main"
llm-asr = "llm_speaker_core.voice.asr:main"
llm-tts = "llm_speaker_core.voice.tts:main"
llm-asr-bridge = "llm_speaker_core.voice.bridge:main"
llm-voice-stack = "llm_speaker_core.voice.stack:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
gigaam = { git = "https://github.com/salute-developers/GigaAM.git" }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.1",
]
