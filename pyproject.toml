[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-speaker-core"
version = "0.1.0"
description = "LLM core for smart speaker: data cleaning, RAG, and text API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.2",
    "bs4>=0.0.2",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
    "pypdf>=6.4.2",
    "pytest>=8.4.1",
    "python-docx>=1.2.0",
    "uvicorn>=0.35.0",
    "tqdm>=4.67.1",
    "requests>=2.32.5",
    "numpy>=2.4.3",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "torch>=2.8.0",
    "resemblyzer>=0.1.4",
    "webrtcvad-wheels>=2.0.14",
    "gigaam",
    "setuptools<81",
]

[project.scripts]
llm-clean-data = "llm_speaker_core.clean_data:main"
llm-build-index = "llm_speaker_core.indexer:main"
llm-api = "llm_speaker_core.api:main"
llm-eval-rag = "llm_speaker_core.evaluate_rag:main"
llm-asr = "llm_speaker_core.voice.asr:main"
llm-tts = "llm_speaker_core.voice.tts:main"
llm-asr-bridge = "llm_speaker_core.voice.bridge:main"
llm-voice-stack = "llm_speaker_core.voice.stack:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
gigaam = { git = "https://github.com/salute-developers/GigaAM.git" }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
